[pytest]
testpaths = tests
pythonpath = .
cache_dir = reports/.pytest_cache
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --strict-markers：写了未注册的 marker 直接报错，防止拼写错误让用例被静默跳过
# --strict-config：配置项写错直接报错，而不是被忽略
addopts =
    -ra
    --strict-markers
    --strict-config
    --html=reports/report.html
    --self-contained-html

markers =
    contract: 契约测试，校验响应结构与 OpenAPI 声明一致
    defect:   已知缺陷的回归用例，未修复时应为 xfail
    permission: 权限矩阵用例，验证 RBAC 隔离
    slow:     耗时较长的用例
    ui:       UI 层用例

log_cli = false
log_level = INFO
filterwarnings =
    ignore::DeprecationWarning
